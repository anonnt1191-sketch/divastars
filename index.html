<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#160b20"/>
<meta name="description" content="Diva's Den — High stakes. Higher heels. A photo-casino about your friend group: 50 games, one shared bank, zero real money."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Diva's Den"/>
<title>Diva's Den — High stakes. Higher heels.</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="assets/ui/bg-title-1.jpg"/>
<link rel="apple-touch-icon" href="assets/ui/bg-title-1.jpg"/>
<style>
  html, body {
    height: 100%; margin: 0; padding: 0; background: #160b20; overflow: hidden;
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: none;
  }
  body { position: fixed; inset: 0; }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #160b20; color: #f2c76e; font-size: 24px; font-style: italic;
    font-family: 'Playfair Display', Georgia, serif; z-index: 1000;
    transition: opacity 0.6s; pointer-events: none;
  }
  #boot.hidden { opacity: 0; }
  #boot .inner { text-align: center; }
  #boot .sub { color: #ff2e88; font-size: 14px; font-style: normal; margin-top: 12px; font-family: 'Outfit', sans-serif; }

  /* Hide Netlify badge (free-tier branding) */
  .netlify-badge,
  iframe[src*="netlify"],
  div[id*="netlify"],
  .netlify-identity-wrapper { display: none !important; visibility: hidden !important; }

  /* Force fullscreen on standalone PWA */
  @media all and (display-mode: fullscreen), all and (display-mode: standalone) {
    body { background: #160b20; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="boot"><div class="inner">
  <div>Diva's Den</div>
  <div class="sub">Loading the girls...</div>
</div></div>

<script src="lib/pixi.min.js"></script>
<script type="module" src="js/main.js"></script>
<script>
  // hide boot screen once main.js finishes
  window.addEventListener("load", () => {
    setTimeout(() => {
      const boot = document.getElementById("boot");
      if (boot) boot.classList.add("hidden");
      setTimeout(() => boot.remove(), 600);
    }, 1800);
  });
  // register service worker for PWA
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(e => console.warn("SW fail", e));
    });
  }
  // try to enter fullscreen on first user gesture (mobile)
  function tryFullscreen() {
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    window.removeEventListener("pointerdown", tryFullscreen);
  }
  window.addEventListener("pointerdown", tryFullscreen);
</script>
</body>
</html>
